name: Bug report
description: Report a reproducible product defect using sanitized information.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, real AWS identifiers, generated Terraform,
        state, plans, inventories, reports, logs, or private paths. Security
        vulnerabilities must use the private process in SECURITY.md, not this form.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Describe the defect using fictitious or redacted identifiers.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Sanitized reproduction
      description: Provide minimal offline steps without AWS credentials or private data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: tf-importer version or commit
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Supported environment
      options:
        - Linux
        - WSL2
        - Other or unknown
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed credentials, real account/resource identifiers, private paths, and runtime artifacts.
          required: true
        - label: This report is not a security vulnerability.
          required: true
